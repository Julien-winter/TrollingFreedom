name: "TrollingFreedom"
version: ${project.version}
description: "Troll plugin with GUI - modernized fork for Minecraft 1.21.x"
author: iAngry
main: me.iangry.trollingfreedom.main.Core
softdepend: [Essentials, ProtocolLib]
api-version: "1.21"
commands:
  trollingfreedom:
    description: Plugin help
    aliases: [ tf ]
  trollgui:
    description: Troll GUI open
    aliases: [tgui, trollingfreedomgui, tfgui]
  untroll:
    description: Untroll player
    aliases: [ stoptroll ]
  trollp:
    description: Troll with CMD
  control:
  test:
